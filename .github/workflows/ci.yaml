---
name: CI

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:

jobs:
  ci:
    name: lint-and-compile
    runs-on: ubuntu-latest
    env:
      ESPHOME_VERSION: 2026.6.5
      PLATFORMIO_LIBDEPS_DIR: ~/.platformio/libdeps
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - id: cache
        name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .venv
          key: esphome-${{ env.ESPHOME_VERSION }}

      - name: Set up virtualenv
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install esphome==${{ env.ESPHOME_VERSION }} yamllint pylint clang-format==22.1.8
        if: steps.cache.outputs.cache-hit != 'true'

      - name: Init virtualenv
        run: |
          source .venv/bin/activate
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> $GITHUB_ENV

      - name: Run yamllint
        run: |
          yamllint $(git ls-files '*.yaml')

      - name: Run pylint
        run: |
          pylint $(git ls-files '*.py')

      - name: Run clang-format
        run: |
          clang-format --dry-run --Werror $(git ls-files '*.cpp' '*.h')

      - name: Compile configs
        run: |
          for f in $(git ls-files 'configs/*.yaml' | grep -v '/secrets\.yaml$')
          do
            sed 's!github://stas-sl/esphome-sound-level-meter!../components!' -i $f
            esphome compile $f
          done

  tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ libgtest-dev

      - name: Configure
        run: cmake -S test -B build

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
